<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roshan Kumar | Portfolio</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        line-height: 1.6;
        color: #333;
      }

      /* NAVBAR */
      .navbar {
        display: flex;
        justify-content: space-between;
        padding: 20px 50px;
        background: #111;
        color: white;
      }

      .navbar h2 {
        color: #00adb5;
      }

      .nav-links a {
        margin-left: 20px;
        color: white;
        text-decoration: none;
      }

      /* HERO SECTION */
      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 60px 50px;
        background: #f5f5f5;
      }

      .hero-text {
        width: 50%;
      }

      .hero-text h1 {
        font-size: 40px;
        margin-bottom: 10px;
      }

      .hero-text span {
        color: #00adb5;
      }

      .hero-text p {
        margin: 15px 0;
      }

      .btn {
        padding: 10px 20px;
        background: #00adb5;
        color: white;
        border: none;
        cursor: pointer;
        margin-top: 10px;
      }

      .hero-img {
        width: 50%;
        display: flex;
        justify-content: center;
      }

      .hero-img img {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      /* SECTION */
      section {
        padding: 50px;
        text-align: center;
      }

      .section-title {
        font-size: 28px;
        margin-bottom: 20px;
        color: #00adb5;
      }

      /* SKILLS */
      .skills {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      .skill {
        padding: 10px 20px;
        background: #eee;
        border-radius: 20px;
      }

      /* PROJECTS */
      .projects {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .project-card {
        width: 250px;
        padding: 20px;
        background: #fafafa;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      /* FOOTER */
      .footer {
        background: #111;
        color: white;
        text-align: center;
        padding: 20px;
      }

      /* 📱 RESPONSIVE */
      @media (max-width: 768px) {
        .hero {
          flex-direction: column;
          text-align: center;
        }

        .hero-text,
        .hero-img {
          width: 100%;
        }

        .hero-img {
          margin-top: 20px;
        }

        .navbar {
          flex-direction: column;
          align-items: center;
        }

        .nav-links {
          margin-top: 10px;
        }
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <div class="navbar">
      <h2>Roshan</h2>
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Skills</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
      </div>
    </div>

    <!-- HERO -->
    <div class="hero">
      <div class="hero-text">
        <h1>Hi, I'm <span>Roshan Kumar</span></h1>
        <p>Frontend Developer | Data Enthusiast</p>
        <button class="btn">Download Resume</button>
      </div>

      <div class="hero-img">
        <img src="./assets/roshan-img.jpeg" alt="Profile" />
      </div>
    </div>

    <!-- SKILLS -->
    <section>
      <h2 class="section-title">Skills</h2>
      <div class="skills">
        <div class="skill">HTML</div>
        <div class="skill">CSS</div>
        <div class="skill">JavaScript</div>
        <div class="skill">React</div>
        <div class="skill">SQL</div>
        <div class="skill">Python</div>
      </div>
    </section>
    <!-- Work Experience -->>
    <section>
      <h2>Work Experinece</h2>
    </section>
    <!-- PROJECTS -->
    <section>
      <h2 class="section-title">Projects</h2>
      <div class="projects">
        <div class="project-card">
          <h3>QuickCart</h3>
          <p>E-commerce app built with React.</p>
        </div>

        <div class="project-card">
          <h3>Kuber CRM</h3>
          <p>Employee management mobile app.</p>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <div class="footer">
      <p>© 2026 Roshan Kumar</p>
    </div>
  </body>
</html>
